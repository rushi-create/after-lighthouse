<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nashik Municipal Corporation — Hero Section (AFTER — rebuilt)</title>

  <!-- Fix 1: no external framework. This hero + service grid needs about 40 lines
       of CSS, not a 200KB framework. Critical CSS is inlined so there is nothing
       render-blocking to fetch before first paint. -->
  <style>
    :root { --brand:#0d3f66; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif; }
    .topbar { background:var(--brand); color:#fff; padding:10px 24px; font-size:14px; display:flex; gap:20px; flex-wrap:wrap; }
    nav.mainnav { background:var(--brand); padding:14px 24px; }
    nav.mainnav a { color:#fff; text-decoration:none; margin-right:24px; font-weight:600; }
    .hero-wrap { position:relative; line-height:0; background:#0d3f66; }
    .hero-wrap img { width:100%; height:auto; display:block; }
    .hero-caption { position:absolute; bottom:24px; left:24px; color:#fff; background:rgba(0,0,0,.35); padding:10px 18px; border-radius:4px; font-size:20px; line-height:1.3; }
    .services { max-width:1100px; margin:40px auto; display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:0 20px; }
    .service-card { text-align:center; padding:24px; border-radius:10px; background:#f3f5f8; }
    .service-card svg { width:56px; height:56px; }
    @media (max-width:600px){ .services{ grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>

  <div class="topbar">
    <span>Helpline No.: 14420</span>
    <span>Grievance: +91-7030300300</span>
    <span>Toll Free NMC: 1800 233 1982</span>
  </div>
  <nav class="mainnav">
    <a href="#">मुख्य पृष्ठ</a>
    <a href="#">आपले शहर</a>
    <a href="#">माहिती</a>
    <a href="#">विभाग</a>
    <a href="#">संपर्क साधा</a>
  </nav>

  <!-- Fix 2: hero image served as compressed WebP, resized to the resolution it's
       actually displayed at (1920×1080 instead of the source 4032×2268), with
       explicit width/height so the browser reserves layout space before the image
       arrives (kills the CLS contribution), and fetchpriority="high" since this
       IS the LCP element and should be fetched as early and eagerly as possible
       (deliberately NOT lazy-loaded — lazy-loading the LCP image is a common
       mistake that would make LCP worse, not better). -->
  <div class="hero-wrap">
    <img src="assets/hero-optimized.webp" width="1920" height="1080"
         fetchpriority="high" alt="Panchavati riverside, Nashik">
    <div class="hero-caption">नाशिक महानगरपालिका — २१ व्या शतकातील शहर</div>
  </div>

  <!-- Fix 3: icons rebuilt as inline SVG. Zero extra network requests for what
       are fundamentally simple two-color glyphs — no raster image, no HTTP
       round-trip, no decode cost. This is the correct fix for icon-grade
       graphics generally, not just a smaller version of the same approach. -->
  <div class="services">
    <div class="service-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d3f66" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>मालमत्ता कर</p>
    </div>
    <div class="service-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c83c32" stroke-width="2"><path d="M12 3s7 7.5 7 12a7 7 0 11-14 0c0-4.5 7-12 7-12z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>पाणी कर</p>
    </div>
    <div class="service-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c83c32" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
      <p>तक्रार निवारण</p>
    </div>
    <div class="service-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1e788c" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke-linecap="round"/></svg>
      <p>नागरी सेवा</p>
    </div>
    <div class="service-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d3f66" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v16" /></svg>
      <p>उत्सव परवानगी</p>
    </div>
    <div class="service-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1e788c" stroke-width="2"><path d="M12 2v20M4 12h16M6 6c3 3 9 3 12 0M6 18c3-3 9-3 12 0" stroke-linecap="round"/></svg>
      <p>उद्यान विभाग</p>
    </div>
  </div>

</body>
</html>
